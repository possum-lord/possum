<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쓰레기통 속 주머니쥐의 포춘쿠키</title>
  <style>
    :root {
      --bg-color: #f3efe6;
      --card-bg: #ffffff;
      --accent: #ff8b94;
      --text-main: #333333;
      --text-sub: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text-main);
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 480px;
      width: 90%;
    }

    .header-text h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-text p {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* 캐릭터 인터랙션 영역 */
    .character-stage {
      position: relative;
      width: 220px;
      height: 220px;
      cursor: pointer;
    }

    .character-stage:hover .possum {
      transform: translateY(-8px);
    }

    .character-stage:active {
      transform: scale(0.96);
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 흔들림 애니메이션 */
    .shake {
      animation: canShake 0.4s ease-in-out;
    }

    @keyframes canShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-6deg) translateX(-4px); }
      40% { transform: rotate(6deg) translateX(4px); }
      60% { transform: rotate(-3deg); }
      80% { transform: rotate(3deg); }
    }

    .possum {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 말풍선 / 운세 카드 */
    .bubble {
      opacity: 0;
      transform: translateY(12px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      position: relative;
      width: 100%;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .bubble::after {
      content: "";
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 8px 8px 8px;
      border-style: solid;
      border-color: transparent transparent var(--card-bg) transparent;
    }

    .fortune-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(255, 139, 148, 0.15);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .fortune-text {
      font-size: 1rem;
      line-height: 1.45;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
    }

    .hint {
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-text">
      <h1>쓰레기통 속 주머니쥐</h1>
      <p>쓰레기통을 톡 치면 오늘의 운세를 꺼내줘요</p>
    </div>

    <!-- 인터랙티브 그래픽 -->
    <div class="character-stage" id="stage" onclick="pickFortune()">
      <svg viewBox="0 0 200 200">
        <!-- 뒤쪽 캔 안쪽 어둠 -->
        <ellipse cx="100" cy="115" rx="60" ry="12" fill="#4a4d52" />

      <!-- 주머니쥐 -->
<g class="possum" id="possum">
  <!-- 꼬리 살짝 삐져나옴 -->
  <path
    d="M 155 125 Q 175 120 170 100 Q 165 90 158 98"
    fill="none"
    stroke="#f6b8b8"
    stroke-width="4"
    stroke-linecap="round"
  />

<!-- 크기는 유지하고 아래로 내린 귀 -->
<ellipse cx="82" cy="70" rx="13.5" ry="15" fill="#444" />
<ellipse cx="82" cy="70" rx="7.5" ry="9" fill="#f6b8b8" />

<ellipse cx="118" cy="70" rx="13.5" ry="15" fill="#444" />
<ellipse cx="118" cy="70" rx="7.5" ry="9" fill="#f6b8b8" />

  <!-- 얼굴/몸통 베이스 -->
  <ellipse
    cx="100"
    cy="95"
    rx="38"
    ry="32"
    fill="#888c94"
  />

  <!-- 얼굴 흰색 털 -->
  <path
    d="
      M 82 84
      C 82 73, 118 73, 118 84
      C 118 91, 114 96, 110 99
      L 100 116
      L 90 99
      C 86 96, 82 91, 82 84
      Z
    "
    fill="#ffffff"
  />

  <!-- 눈: 단색 검은색 원 -->
  <circle
    cx="88"
    cy="90"
    r="5"
    fill="#111111"
  />

  <circle
    cx="112"
    cy="90"
    r="5"
    fill="#111111"
  />


  <!-- 뾰족한 주둥이 -->
  <path
    d="
      M 91 101
      Q 100 98, 109 101
      L 100 116
      Z
    "
    fill="#f4f4f4"
  />

  <!-- 분홍색 작은 코 -->
  <path
    d="
      M 96 110
      Q 100 107, 104 110
      Q 103 114, 100 115
      Q 97 114, 96 110
      Z
    "
    fill="#f6a9ad"
  />

  <!-- 작은 앞발 (쓰레기통 림 잡기) -->
  <ellipse
    cx="82"
    cy="116"
    rx="5"
    ry="4"
    fill="#f6b8b8"
  />

  <ellipse
    cx="118"
    cy="116"
    rx="5"
    ry="4"
    fill="#f6b8b8"
  />
</g>

        <!-- 쓰레기통 몸체 -->
        <g id="trashCan">
          <!-- 캔 몸통 (사다리꼴) -->
          <path d="M 44 116 L 56 185 Q 100 195 144 185 L 156 116 Z" fill="#9aa0a6" />
          <!-- 캔 텍스처 줄무늬 -->
          <path d="M 75 118 L 80 187" stroke="#80868b" stroke-width="3" stroke-linecap="round" />
          <path d="M 100 118 L 100 189" stroke="#80868b" stroke-width="3" stroke-linecap="round" />
          <path d="M 125 118 L 120 187" stroke="#80868b" stroke-width="3" stroke-linecap="round" />

          <!-- 캔 입구 테두리 (림) -->
          <ellipse cx="100" cy="116" rx="58" ry="11" fill="#bdc1c6" />
          <ellipse cx="100" cy="116" rx="54" ry="8" fill="none" stroke="#80868b" stroke-width="1.5" />
        </g>
      </svg>
    </div>

    <!-- 운세 말풍선 -->
    <div class="bubble" id="fortuneBubble">
      <span class="fortune-tag" id="fortuneTag">오늘의 운세</span>
      <p class="fortune-text" id="fortuneText">클릭하면 오늘의 운세를 말해줄게!</p>
    </div>

    <div class="hint">쓰레기통을 탭해서 새로운 운세를 확인하세요</div>
  </div>

  <script>
    // 일반적이고 따뜻한 운세 데이터
const fortunes = [
  // 1 ~ 20
  { tag: "행운", text: "예상치 못한 곳에서 소소하지만 기분 좋은 행운을 만나게 돼요." },
  { tag: "용기", text: "망설이던 일이 있다면 오늘 과감하게 시작해보세요. 생각보다 순조로울 거예요." },
  { tag: "인연", text: "주변 사람과의 따뜻한 대화 한마디가 오늘 하루를 든든하게 채워줍니다." },
  { tag: "휴식", text: "잠깐의 차 한 잔과 깊은 심호흡이 더 맑은 집중력을 선물할 거예요." },
  { tag: "선물", text: "오늘은 나를 위한 작은 보상(맛있는 간식, 조기 퇴근)을 아끼지 마세요." },
  { tag: "자신감", text: "스스로를 의심하지 마세요. 이미 충분히 잘 해내고 있습니다." },
  { tag: "결실", text: "그동안 조용히 공들여온 일에 작고 반가운 변화가 찾아옵니다." },
  { tag: "직감", text: "오늘 떠오르는 첫 번째 직감을 믿어보세요. 꽤 훌륭한 선택이 됩니다." },
  { tag: "컨디션", text: "몸과 마음의 에너지가 차오르는 날입니다. 가벼운 산책을 추천해요." },
  { tag: "관계", text: "먼저 건네는 사소한 인사가 뜻밖의 커다란 호의로 돌아오게 됩니다." },
  { tag: "행운", text: "우연히 들른 장소나 가게에서 기분 좋은 발견을 하게 됩니다." },
  { tag: "기회", text: "생각지 못했던 방향에서 새로운 가능성의 문이 살짝 열립니다." },
  { tag: "마음", text: "복잡했던 머릿속 생각이 말끔하게 정리되는 순간이 찾아옵니다." },
  { tag: "소확행", text: "좋아하는 노래를 들으며 걷는 짧은 이동 시간이 하루의 하이라이트가 됩니다." },
  { tag: "성장", text: "과거의 실수라 여겼던 경험이 오늘 뜻밖의 지혜로 발휘됩니다." },
  { tag: "온기", text: "잊고 지냈던 지인에게서 반가운 안부 연락이 올 수 있어요." },
  { tag: "도전", text: "한 번도 시도해보지 않은 사소한 일탈이 일상에 활력을 불어넣습니다." },
  { tag: "정리", text: "주변 책상이나 서랍을 가볍게 치워보세요. 묵은 고민도 함께 씻겨나갑니다." },
  { tag: "여유", text: "서두르지 않아도 괜찮습니다. 모든 일에는 자연스러운 타이밍이 있어요." },
  { tag: "힐링", text: "창밖의 햇살이나 스치는 바람만으로도 깊은 위로를 받는 날입니다." },

  // 21 ~ 40
  { tag: "집중", text: "미뤄두었던 핵심적인 과제를 놀라운 몰입감으로 끝마치게 됩니다." },
  { tag: "행운", text: "신호등이 연속으로 초록불이 되는 것처럼 매끄러운 타이밍을 경험합니다." },
  { tag: "만남", text: "나와 가치관이 잘 맞는 긍정적인 사람과 대화를 나눌 기회가 생깁니다." },
  { tag: "건강", text: "충분한 수분 섭취와 바른 자세만 챙겨도 몸이 한결 가벼워집니다." },
  { tag: "희망", text: "답답하던 문제에 작은 실마리가 보여 안도의 한숨을 내쉬게 됩니다." },
  { tag: "칭찬", text: "당신이 남몰래 기울인 노력을 누군가 알아보고 따뜻한 말을 건넵니다." },
  { tag: "영감", text: "길을 걷다 스친 풍경이나 사소한 단어에서 반짝이는 아이디어를 얻습니다." },
  { tag: "평온", text: "누구에게도 방해받지 않는 혼자만의 고요한 저녁 시간이 기다립니다." },
  { tag: "선택", text: "A와 B 중 고민된다면, 나를 조금 더 설레게 하는 쪽을 골라보세요." },
  { tag: "미소", text: "사소한 농담 하나로 주위 사람들과 크게 웃을 수 있는 날입니다." },
  { tag: "극복", text: "어렵게 느껴졌던 장벽이 막상 마주하니 생각보다 낮다는 걸 알게 됩니다." },
  { tag: "행운", text: "주머니 속 잊고 있던 지폐처럼 소소하고 깜짝 놀랄 기쁨이 찾아옵니다." },
  { tag: "감사", text: "평범하다고 여겼던 일상의 한 부분이 새삼 소중하게 느껴집니다." },
  { tag: "표현", text: "마음속에 품고 있던 고마움을 솔직하게 전해보세요. 관계가 한층 깊어집니다." },
  { tag: "재충전", text: "좋아하는 음식을 먹는 것만으로도 하루의 피로가 사르르 녹아내립니다." },
  { tag: "타이밍", text: "기다렸던 소식이나 답변이 가장 적절한 순간에 도착합니다." },
  { tag: "지혜", text: "상대방의 입장에서 한 번 더 바라보면 쉽게 풀릴 문제가 있습니다." },
  { tag: "자유", text: "타인의 시선에서 벗어나 내 진짜 마음에만 집중하는 하루를 보내세요." },
  { tag: "새출발", text: "어제까지의 아쉬움은 털어내세요. 오늘은 완전히 새로운 페이지입니다." },
  { tag: "성취", text: "오늘 할 일 목록의 체크 박스를 하나씩 지워나가는 쾌감이 큽니다." },

  // 41 ~ 60
  { tag: "행운", text: "우연히 집어 든 책이나 글귀에서 인생의 힌트를 얻게 됩니다." },
  { tag: "배려", text: "무심코 베푼 작은 친절이 돌고 돌아 더 큰 배려로 돌아옵니다." },
  { tag: "휴식", text: "스마트폰을 잠시 내려놓고 멍하니 쉼을 즐기기에 좋은 날입니다." },
  { tag: "용기", text: "거절하기 어려웠던 부탁에 부드럽고 단호하게 '아니오'를 말해보세요." },
  { tag: "인연", text: "오래된 친구에게 가벼운 안부 메시지를 보내보세요. 반가운 답이 옵니다." },
  { tag: "발견", text: "자주 다니던 길에서 그동안 보지 못했던 예쁜 풍경을 발견합니다." },
  { tag: "자신감", text: "나만의 독특한 개성과 방식이 오늘은 강력한 무기가 됩니다." },
  { tag: "안도", text: "걱정했던 상황이 별일 없이 조용히 지나가 마음이 편안해집니다." },
  { tag: "풍요", text: "필요했던 물건을 좋은 조건이나 할인된 가격에 구하게 됩니다." },
  { tag: "호기심", text: "새로운 분야의 정보를 접하며 신선한 지적 자극을 받습니다." },
  { tag: "수용", text: "통제할 수 없는 일은 흘려보내고, 내가 바꿀 수 있는 것에 집중하세요." },
  { tag: "변화", text: "매일 마시던 음료나 출근 루트를 살짝 바꾸는 것만으로 기분이 전환됩니다." },
  { tag: "지탱", text: "혼자 끙끙 앓지 않아도 곁에서 묵묵히 지지해주는 사람이 있습니다." },
  { tag: "매력", text: "오늘따라 당신의 자연스러운 말투와 태도가 주위를 편안하게 만듭니다." },
  { tag: "행운", text: "딱 원하던 자리에 앉거나 원하는 순번을 얻는 작은 행운이 따릅니다." },
  { tag: "건강", text: "가벼운 스트레칭 몇 번으로 뻐근했던 어깨가 시원하게 풀립니다." },
  { tag: "속도", text: "남들의 속도에 맞추지 마세요. 내 보폭대로 꾸준히 걷는 것이 정답입니다." },
  { tag: "공감", text: "깊은 대화를 통해 서로의 감정을 깊이 이해하고 신뢰를 쌓게 됩니다." },
  { tag: "결정", text: "미뤄왔던 중요한 결정을 내리기 좋은 맑은 판단력이 생깁니다." },
  { tag: "선물", text: "예상치 못한 간식이나 따뜻한 음료를 누군가에게 건네받을 수 있어요." },

  // 61 ~ 80
  { tag: "기회", text: "그냥 지나칠 뻔했던 대화 속에서 귀중한 정보나 기회를 캐치합니다." },
  { tag: "마음", text: "복잡한 감정을 글이나 일기로 적어보면 금세 마음이 고요해집니다." },
  { tag: "유머", text: "어색할 수 있는 상황을 유쾌한 재치 한마디로 부드럽게 넘깁니다." },
  { tag: "자책금지", text: "완벽하지 않아도 괜찮습니다. 최선을 다한 것만으로도 충분합니다." },
  { tag: "행운", text: "딱 필요했던 순간에 정확한 타이밍으로 도움이 도착합니다." },
  { tag: "취향", text: "나만의 확실한 취향을 확인하고 그 안에서 깊은 안정감을 느낍니다." },
  { tag: "도전", text: "새로운 메뉴를 주문해보세요. 의외의 인생 맛집을 찾을 수 있습니다." },
  { tag: "인내", text: "조금만 더 버텨보세요. 기다리던 결과가 바로 모퉁이 뒤에 있습니다." },
  { tag: "수면", text: "오늘 밤은 꿈도 꾸지 않고 푹신한 숙면을 취해 피로가 싹 가십니다." },
  { tag: "정직", text: "내 감정에 솔직해질 때 비로소 진정한 위로와 해답이 찾아옵니다." },

    let lastIndex = -1;

    // 귀여운 신시사이저 비프음 (Web Audio API - 외부 오디오 파일 불필요)
    function playCuteSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.15); // G5

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {
        // 브라우저 자동 재생 제한 무시
      }
    }

    function pickFortune() {
      const stage = document.getElementById("stage");
      const bubble = document.getElementById("fortuneBubble");
      const tag = document.getElementById("fortuneTag");
      const text = document.getElementById("fortuneText");

      // 쓰레기통 흔들림 애니메이션 트리거
      stage.classList.remove("shake");
      void stage.offsetWidth; // Reflow 트리거
      stage.classList.add("shake");

      // 효과음 재생
      playCuteSound();

      // 중복 방지 랜덤 선택
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * fortunes.length);
      } while (randomIndex === lastIndex && fortunes.length > 1);
      lastIndex = randomIndex;

      const selected = fortunes[randomIndex];

      // 말풍선 갱신 및 표시
      tag.textContent = `오늘의 ${selected.tag}`;
      text.textContent = selected.text;
      bubble.classList.add("show");
    }
  </script>
